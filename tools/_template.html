<!--
  Startup Moxie · AI tool TEMPLATE
  ================================
  Copy this file to tools/weekNN-name.html and fill the three TODO blocks:
    (A) META      — week number, title, one-line "what you'll leave with"
    (B) INPUTS    — the fields the student fills about THEIR business
    (C) TASK      — the per-tool instruction appended to MOXIE_PREAMBLE

  Everything else (brand, theming, the AI bridge, export) is shared and should
  NOT be edited per week — that's the point of the template.

  MECHANISM: every AI call goes through callClaude() — the ONE place the bridge
  lives. If the Phase-0 spike shows window.claude.complete is unavailable to free
  viewers, swap the body of callClaude() here and every tool inherits the fix.

  These are single-file artifacts: the Artifact CSP blocks external hosts, so
  fonts fall back to system-ui and nothing is fetched. Brand carries in color.
-->
<title>Moxie Tool · Template</title>
<style>
  :root {
    /* Moxie brand (from design-system-tokens/colors.css) */
    --blue-900:#062f4d; --blue-700:#0c5689; --blue-500:#2b7fb8; --blue-050:#eef5fa;
    --pink-600:#e3359e; --pink-100:#fbdcef; --lime-500:#d8d849; --purple-600:#575da9;
    --ink-900:#14202b; --ink-700:#33475a; --ink-500:#5c6b78; --line-200:#d9e0e6;
    --paper-0:#ffffff; --paper-50:#f5f8fa;
    --ok:#2f9e6b; --bad:#d64545; --wait:#e0a23a;

    /* Semantic tokens — style through these, never the raw ramp */
    --bg:var(--paper-50); --card:var(--paper-0); --text:var(--ink-700);
    --head:var(--ink-900); --muted:var(--ink-500); --border:var(--line-200);
    --accent:var(--pink-600); --primary:var(--blue-700); --soft:var(--blue-050);
    --field:#ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0b1620; --card:#132330; --text:#c6d3dd; --head:#eef5fa; --muted:#8a97a2;
      --border:#25384a; --soft:#12202c; --field:#0e1c27;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0b1620; --card:#132330; --text:#c6d3dd; --head:#eef5fa; --muted:#8a97a2;
    --border:#25384a; --soft:#12202c; --field:#0e1c27;
  }
  :root[data-theme="light"] {
    --bg:var(--paper-50); --card:var(--paper-0); --text:var(--ink-700); --head:var(--ink-900);
    --muted:var(--ink-500); --border:var(--line-200); --soft:var(--blue-050); --field:#ffffff;
  }

  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:720px; margin:0 auto; padding:44px 22px 96px; }

  header.tool-head { margin-bottom:32px; }
  .eyebrow { font-weight:700; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin:0 0 10px; }
  h1 { font-size:31px; line-height:1.12; letter-spacing:-.02em; color:var(--head); margin:0 0 10px; font-weight:800; text-wrap:balance; }
  .leave-with { color:var(--muted); font-size:16px; margin:0; max-width:60ch; }

  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:24px; margin-bottom:20px; }
  .card > .sec { font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0 0 18px; font-weight:700; }

  label { display:block; font-weight:600; color:var(--head); font-size:14px; margin:0 0 6px; }
  .hint { font-weight:400; color:var(--muted); }
  .field { margin-bottom:18px; }
  .field:last-child { margin-bottom:0; }
  input[type=text], textarea, select {
    width:100%; font:inherit; color:var(--head); background:var(--field);
    border:1px solid var(--border); border-radius:9px; padding:11px 13px; resize:vertical;
  }
  input[type=text]:focus, textarea:focus, select:focus { outline:2px solid var(--primary); outline-offset:1px; border-color:var(--primary); }
  textarea { min-height:84px; line-height:1.5; }

  .actions { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:4px; }
  button { appearance:none; border:none; cursor:pointer; font:inherit; font-weight:700; border-radius:10px; font-size:15px; transition:background .15s,opacity .15s; }
  .btn-primary { background:var(--primary); color:#fff; padding:14px 24px; }
  .btn-primary:hover:not(:disabled) { background:var(--blue-900); }
  .btn-primary:disabled { opacity:.5; cursor:not-allowed; }
  .btn-ghost { background:transparent; color:var(--primary); padding:10px 4px; }
  .btn-ghost:hover { color:var(--accent); }
  button:focus-visible { outline:3px solid var(--lime-500); outline-offset:2px; }

  .spinner { width:16px; height:16px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; display:inline-block; vertical-align:-3px; margin-right:8px; animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion:reduce) { .spinner { animation:none; } }

  .banner { padding:13px 16px; border-radius:10px; font-size:14px; font-weight:600; margin-bottom:18px; display:none; }
  .banner.show { display:block; }
  .banner.err { background:#fbe4e4; color:var(--bad); }
  @media (prefers-color-scheme: dark){ .banner.err { background:#2a1618; } }

  #outCard { display:none; }
  #outCard.show { display:block; }
  .out-body { color:var(--text); font-size:15.5px; }
  .out-body h3 { color:var(--head); font-size:17px; margin:22px 0 8px; }
  .out-body h3:first-child { margin-top:0; }
  .out-body p { margin:0 0 12px; }
  .out-body ul { margin:0 0 12px; padding-left:20px; }
  .out-body li { margin:4px 0; }
  .out-body strong { color:var(--head); }
  .export { display:flex; gap:14px; margin-top:20px; padding-top:18px; border-top:1px solid var(--border); }

  .toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:var(--head); color:var(--bg); padding:10px 18px; border-radius:8px; font-size:14px; font-weight:600; opacity:0; pointer-events:none; transition:opacity .2s; }
  .toast.show { opacity:1; }
  footer { color:var(--muted); font-size:12.5px; text-align:center; margin-top:30px; }
  footer .dot { color:var(--lime-500); }
</style>

<div class="wrap">
  <!-- ============ (A) META — edit per week ============ -->
  <header class="tool-head">
    <p class="eyebrow" id="eyebrow">Startup Moxie · Week 00</p>
    <h1 id="title">Tool title goes here</h1>
    <p class="leave-with" id="leaveWith">One line: what the student walks away holding.</p>
  </header>

  <div class="banner err" id="bridgeBanner"></div>

  <!-- ============ (B) INPUTS — edit per week ============ -->
  <div class="card">
    <p class="sec">Your business</p>
    <div class="field">
      <label for="in_idea">In one line, what are you building? <span class="hint">— be specific</span></label>
      <input type="text" id="in_idea" placeholder="e.g. resin keychains sold at school events" />
    </div>
    <div class="field">
      <label for="in_notes">Anything else the coach should know? <span class="hint">— optional</span></label>
      <textarea id="in_notes" placeholder="who it's for, what's working, what you're stuck on"></textarea>
    </div>
    <div class="actions">
      <button class="btn-primary" id="go">Coach me</button>
    </div>
  </div>

  <!-- ============ OUTPUT — shared ============ -->
  <div class="card" id="outCard">
    <p class="sec">Your coach</p>
    <div class="out-body" id="out"></div>
    <div class="export">
      <button class="btn-ghost" id="copy">Copy</button>
      <button class="btn-ghost" id="download">Download</button>
    </div>
  </div>

  <footer>AI drafts <span class="dot">·</span> you decide <span class="dot">·</span> systems compound</footer>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  /* ============ SHARED — do not edit per week ============ */

  // The Moxie voice + framework the coach must stay inside. Every tool prepends this.
  var MOXIE_PREAMBLE = [
    "You are a coach inside Startup Moxie, a high-school entrepreneurship program where teenagers build real businesses.",
    "Speak warm, direct, and practical — like someone who has actually done the work helping a student move. Never corporate.",
    "Stay inside the Moxie method and use its language where it fits: May-B-P (the smallest testable version, the step before an MVP), the Mom Test (ask about their life, not your idea), OODA loops, Walk-Talk-Show-Up discovery, 5 Whys, Problem-Solution-Ask pitches, effectuation / Bird-in-Hand (start from what you already have), TAM/SAM/SOM.",
    "Rules: the student does the thinking — you sharpen it, you don't do it for them. Be concrete over abstract. Prefer the smallest real-world next step. Never invent facts about their business; if something's missing, say what you'd need. Keep it tight — a teenager reads this at 7:30am.",
    "Avoid: leverage, unlock, disrupt, synergy, transformational, 'I hope this helps'."
  ].join("\n");

  // THE ONE PLACE THE AI MECHANISM LIVES.
  // Happy path: published artifacts expose window.claude.complete, running on the
  // viewer's own (free) account. If the Phase-0 spike disproves that, replace the
  // body of this function (e.g. a hosted endpoint) — no tool needs to change.
  function bridgeReady() {
    return typeof window.claude !== "undefined" && window.claude &&
           typeof window.claude.complete === "function";
  }
  async function callClaude(prompt) {
    if (!bridgeReady()) {
      throw new Error("AI bridge unavailable. Open this on a signed-in Claude account (a free account is fine).");
    }
    var reply = await window.claude.complete(prompt);
    return (reply == null ? "" : String(reply)).trim();
  }

  // Minimal, safe markdown → HTML for the coach's reply (headings, bold, bullets).
  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function render(md) {
    var lines = esc(md).split(/\r?\n/), html = "", inList = false;
    function closeList(){ if(inList){ html+="</ul>"; inList=false; } }
    lines.forEach(function (raw) {
      var line = raw.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      var h = line.match(/^(#{1,4})\s+(.*)$/);
      var b = line.match(/^\s*[-*•]\s+(.*)$/);
      if (h) { closeList(); html += "<h3>" + h[2] + "</h3>"; }
      else if (b) { if(!inList){html+="<ul>";inList=true;} html += "<li>" + b[1] + "</li>"; }
      else if (line.trim() === "") { closeList(); }
      else { closeList(); html += "<p>" + line + "</p>"; }
    });
    closeList();
    return html;
  }

  function toast(msg){ var t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(function(){t.classList.remove("show");},1600); }

  // Wire the shared output + export controls given a plain-text getter.
  function wireExport(getText, filename) {
    document.getElementById("copy").addEventListener("click", function(){
      if(navigator.clipboard) navigator.clipboard.writeText(getText()).then(function(){toast("Copied");},function(){});
    });
    document.getElementById("download").addEventListener("click", function(){
      var blob=new Blob([getText()],{type:"text/plain"});
      var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename; a.click(); URL.revokeObjectURL(a.href);
    });
  }

  // Surface the bridge state up front so a student on the wrong account learns why.
  function showBridgeBannerIfNeeded() {
    if (!bridgeReady()) {
      var b=document.getElementById("bridgeBanner");
      b.textContent="This tool needs a signed-in Claude account to coach you — a free account works. Open the link while logged in.";
      b.classList.add("show");
    }
  }

  /* ============ (C) TASK — edit per week ============ */
  // Build the per-tool prompt from the inputs. Keep it ONE call per button press.
  function buildPrompt(inputs) {
    return MOXIE_PREAMBLE + "\n\n---\n\n" +
      "TASK: This is a demo of the tool template. Sharpen the student's idea below.\n" +
      "Give: (1) one sharper one-line version of their idea, (2) the single riskiest assumption, " +
      "(3) the smallest real-world test they could run this week. Use short headers.\n\n" +
      "Their idea: " + inputs.idea + "\n" +
      "Notes: " + (inputs.notes || "(none)");
  }

  /* ============ SHARED wiring ============ */
  showBridgeBannerIfNeeded();
  var lastText = "";
  wireExport(function(){ return lastText; }, "moxie-tool-output.txt");

  var go = document.getElementById("go");
  go.addEventListener("click", async function () {
    var idea = document.getElementById("in_idea").value.trim();
    if (!idea) { document.getElementById("in_idea").focus(); toast("Add your idea first"); return; }

    go.disabled = true;
    var label = go.textContent; go.innerHTML = '<span class="spinner"></span>Thinking…';
    var outCard = document.getElementById("outCard"), out = document.getElementById("out");
    try {
      var reply = await callClaude(buildPrompt({ idea: idea, notes: document.getElementById("in_notes").value.trim() }));
      lastText = reply;
      out.innerHTML = render(reply);
      outCard.classList.add("show");
      outCard.scrollIntoView({ behavior: "smooth", block: "start" });
    } catch (e) {
      out.innerHTML = '<p style="color:var(--bad)"><strong>Couldn\'t reach the coach.</strong><br>' + esc(e.message) + '</p>';
      outCard.classList.add("show");
    } finally {
      go.disabled = false; go.textContent = label;
    }
  });
})();
</script>
